name: Agendador de publicações

# Chama o sistema a cada ~5 minutos para publicar o que já venceu.
# (O cron da Vercel no plano Hobby roda no máximo 1x/dia; o GitHub Actions cobre o resto.)
# O GitHub pode atrasar execuções agendadas em alguns minutos: o horário é "a partir de", não exato.
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      ex.: https://nubi-studio.vercel.app
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET na Vercel
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-scheduler
  cancel-in-progress: false

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Publicar o que venceu
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Defina os secrets APP_URL e CRON_SECRET no repositório." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/publish"
